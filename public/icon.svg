<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cardGrad)" stroke-width="8" />

  <!-- Icon Group -->
  <g filter="url(#shadow)">
    <!-- Toga Hat Cap -->
    <path d="M 256 120 L 400 195 L 256 270 L 112 195 Z" fill="#ffffff" />
    
    <!-- Toga Hat Underside / Base -->
    <path d="M 160 220 L 160 280 C 160 330 352 330 352 280 L 352 220 L 256 265 Z" fill="#e2e8f0" />

    <!-- Tassel Ribbon & Cord -->
    <path d="M 380 205 L 410 270 L 402 330 L 418 330 L 410 270 Z" fill="url(#goldGrad)" />
    <circle cx="410" cy="336" r="8" fill="url(#goldGrad)" />
    <circle cx="256" cy="195" r="7" fill="url(#goldGrad)" />

    <!-- Open Book below toga -->
    <path d="M 140 330 C 185 315 235 320 256 345 C 277 320 327 315 372 330 L 372 390 C 327 375 277 380 256 405 C 235 380 185 375 140 390 Z" fill="#ffffff" />
    <path d="M 256 345 L 256 405" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />

    <!-- Gold Sparkle / Star (Top Right) -->
    <path d="M 390 110 Q 390 135 415 135 Q 390 135 390 160 Q 390 135 365 135 Q 390 135 390 110 Z" fill="url(#goldGrad)" />
    <!-- Mini Sparkle (Left) -->
    <path d="M 115 140 Q 115 155 130 155 Q 115 155 115 170 Q 115 155 100 155 Q 115 155 115 140 Z" fill="url(#goldGrad)" />
  </g>
</svg>
